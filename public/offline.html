<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamePad - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0B4F6C 0%, #01BAEF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: #0B4F6C;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
        }

        h1 {
            color: #0B4F6C;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            background: #0B4F6C;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .button:hover {
            background: #01BAEF;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(1, 186, 239, 0.3);
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 10px;
            font-size: 14px;
            color: #475569;
        }

        .online {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Você está offline</h1>
        <p>
            Não foi possível conectar ao ExamePad.
            Verifique sua conexão com a internet e tente novamente.
        </p>
        <button class="button" onclick="location.reload()">
            🔄 Tentar Novamente
        </button>
        <div class="status" id="status">
            Aguardando conexão...
        </div>
    </div>

    <script>
        // Monitora status da conexão
        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (navigator.onLine) {
                statusEl.textContent = '✅ Conexão restaurada! Clique em "Tentar Novamente"';
                statusEl.classList.add('online');
            } else {
                statusEl.textContent = '❌ Sem conexão com a internet';
                statusEl.classList.remove('online');
            }
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        // Auto-reload quando voltar online
        window.addEventListener('online', () => {
            setTimeout(() => {
                location.reload();
            }, 2000);
        });
    </script>
</body>

</html>
