server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck simples (opcional, mas ajuda muito em deploy)
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Cache agressivo para arquivos versionados do Vite
  location ^~ /assets/ {
    expires 365d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Cache moderado para estáticos em geral
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Gzip (leve e seguro)
  gzip on;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

  # Headers básicos
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
