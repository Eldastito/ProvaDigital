// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Tenta corrigir o Proguard obsoleto em módulos de terceiros
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.buildTypes.all { buildType ->
                try {
                    def oldFile = "proguard-android.txt"
                    def newFile = "proguard-android-optimize.txt"
                    
                    def currentFiles = buildType.proguardFiles
                    if (currentFiles.any { it.toString().contains(oldFile) }) {
                        def updatedFiles = currentFiles.collect { 
                            it.toString().contains(oldFile) ? project.android.getDefaultProguardFile(newFile) : it
                        }
                        buildType.setProguardFiles(updatedFiles)
                    }
                } catch (Exception e) {
                    // Ignora
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
