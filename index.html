  <script>
    // Define immediate global aliases for Lucide icons before modules load
    (function() {
      const fix = () => {
        if (window.lucide) {
          window.Globe = window.lucide.Globe || (window.lucide.icons && window.lucide.icons.Globe);
          console.log('✅ Lucide Globe Aliased');
        }
      };
      if (typeof lucide !== 'undefined') fix();
      else window.addEventListener('DOMContentLoaded', fix);
    })();
  </script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#112131',      // Novo corporativo
              primary: '#1b6ca8',   // Oceano
              secondary: '#0ca3e1', // Céu
              accent: '#46c4f3',    // Água
              mint: '#1cd3a2',      // Sucesso
              teal: '#00ae84',      // Institucional
              cloud: '#f8fafc',     // Fundo Luz
              input: '#162a42',     // Legado (remover dps)
            },
            primary: 'var(--text-primary)',
            secondary: 'var(--text-secondary)',
            divider: 'var(--border-color)',
            surface: 'var(--bg-surface)',
          },
          backgroundColor: {
            primary: 'var(--bg-primary)',
            secondary: 'var(--bg-secondary)',
            surface: 'var(--bg-surface)',
          },
          textColor: {
            primary: 'var(--text-primary)',
            secondary: 'var(--text-secondary)',
            accent: 'var(--brand-primary)',
          },
          borderColor: {
            divider: 'var(--border-color)',
            brand: 'var(--brand-primary)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Scrollbar styles moved to index.css (uses design tokens) */

    /* Fix for select dropdown options (browser default needs handling) */
    option {
      background-color: var(--bg-surface, #ffffff);
      color: var(--text-primary, #0f172a);
    }

    /* --- Standard Button Gradient --- */
    .btn-gradient {
      background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 119, 182, 0.3);
    }

    .btn-gradient:hover {
      background: linear-gradient(135deg, #023e8a 0%, #0077b6 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -1px rgba(0, 119, 182, 0.4);
    }

    .btn-gradient:active {
      transform: translateY(0);
    }

    /* Rich Text Content Styles */
    .rich-content p {
      margin-bottom: 0.75em;
    }

    .rich-content code {
      background: #f1f5f9;
      color: #ef4444;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: monospace;
    }

    .rich-content pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    .rich-content blockquote {
      border-left: 4px solid #00b4d8;
      padding-left: 1rem;
      font-style: italic;
      color: #475569;
    }

    .rich-content .katex-display {
      margin: 1em 0;
      overflow-x: auto;
      overflow-y: hidden;
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "lucide-react": "/vendor/lucide.js",

</script>
  <script type="module" crossorigin src="/index.tsx"></script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('✅ Service Worker registrado:', registration.scope);

            // Verifica atualizações a cada 1 hora
            setInterval(() => {
              registration.update();
            }, 3600000);
          })
          .catch((error) => {
            console.error('❌ Erro ao registrar Service Worker:', error);
          });
      });
    }

    // Detecta quando o app está instalado
    window.addEventListener('appinstalled', () => {
      console.log('🎉 ExamePad instalado com sucesso!');
      // Opcional: Enviar analytics
    });

    // Prompt de instalação (para mostrar banner customizado)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('💡 App pode ser instalado');
      // Aqui você pode mostrar um banner customizado
      // Ex: showInstallBanner();
    });
  </script>
</body>

</html>
