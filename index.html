
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamePad SaaS | Inteligência Educacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#1e293b',    /* Slate 800 - Profissional */
                light: '#f1f5f9',   /* Slate 100 - Fundo Limpo */
                primary: '#4f46e5', /* Indigo 600 */
                secondary: '#0ea5e9',/* Sky 500 */
                accent: '#8b5cf6',  /* Violet 500 */
                surface: '#ffffff',
              }
            },
            backgroundImage: {
              'soft-gradient': "linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)",
              'login-split': "linear-gradient(to right, rgba(255,255,255,0.9) 50%, rgba(30,41,59,0.95) 50%)",
            }
          }
        }
      }
    </script>
    <style>
      body { 
        background-color: #f8fafc;
        color: #0f172a;
        overflow-x: hidden;
      }
      
      /* Card Moderno e Claro */
      .glass-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      }

      .sidebar-dark {
        background: #0f172a;
        color: #f8fafc;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { 
        background: #cbd5e1; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* Inputs com alta visibilidade */
      input, select, textarea {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
        border-radius: 0.75rem !important;
        padding: 0.75rem 1rem !important;
      }
      
      input:focus {
        border-color: #4f46e5 !important;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1) !important;
        outline: none !important;
      }

      .btn-premium {
        background: #4f46e5;
        color: white;
        box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.3);
        transition: all 0.2s ease;
      }
      .btn-premium:hover {
        background: #4338ca;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
      }

      .fade-up {
        animation: fadeUp 0.5s ease-out forwards;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@^5.90.12",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "zustand": "https://esm.sh/zustand@^5.0.9",
    "dexie": "https://esm.sh/dexie@^4.2.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
</head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
